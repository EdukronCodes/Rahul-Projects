apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail
  annotations:
    cert-manager.io/cluster-issuer: retail-letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: retail-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retail
                port:
                  name: http
