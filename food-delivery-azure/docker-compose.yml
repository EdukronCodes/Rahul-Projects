services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://food:food@db:5432/fooddelivery
      ADMIN_TOKEN: local-dev-change-me
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
    volumes:
      - food_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d fooddelivery"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  food_data:
