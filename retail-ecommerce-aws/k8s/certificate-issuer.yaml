apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: retail-letsencrypt
spec:
  acme:
    email: replace-with-operations-email@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: retail-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
