services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://retail:retail@db:5432/retail
      ADMIN_TOKEN: local-dev-change-me
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    volumes:
      - retail_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  retail_data:
