apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: food.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-delivery
                port:
                  name: http
  # Configure TLS after installing cert-manager and issuing a certificate.
