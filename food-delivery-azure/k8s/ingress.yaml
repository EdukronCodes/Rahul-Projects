apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery
  annotations:
    cert-manager.io/cluster-issuer: food-delivery-letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - food.example.com
      secretName: food-delivery-tls
  rules:
    - host: food.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-delivery
                port:
                  name: http
