trigger:
  branches:
    include:
      - main

variables:
  imageRepository: food-delivery
  dockerfilePath: $(Build.SourcesDirectory)/food-delivery-azure/Dockerfile
  tag: $(Build.BuildId)

stages:
  - stage: Test
    jobs:
      - job: PythonTests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
          - script: |
              python -m pip install -r food-delivery-azure/requirements.txt
              cd food-delivery-azure && pytest -q
            displayName: Install dependencies and run tests
          - task: Docker@2
            displayName: Build container image
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              tags: $(tag)
  - stage: Deploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployAzureContainerApp
        environment: food-delivery-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Provision or update Azure infrastructure
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az deployment group create \
                        --resource-group "$(AZURE_RESOURCE_GROUP)" \
                        --template-file "$(Build.SourcesDirectory)/food-delivery-azure/infra/main.bicep" \
                        --parameters location="$(AZURE_LOCATION)" \
                          appName="$(AZURE_APP_NAME)" \
                          image="$(ACR_LOGIN_SERVER)/$(imageRepository):$(tag)" \
                          registryServer="$(ACR_LOGIN_SERVER)" \
                          registryUsername="$(ACR_USERNAME)" \
                          registryPassword="$(ACR_PASSWORD)" \
                          databasePassword="$(FOOD_DB_PASSWORD)"
                - task: Docker@2
                  displayName: Push image to Azure Container Registry
                  inputs:
                    command: push
                    containerRegistry: $(ACR_SERVICE_CONNECTION)
                    repository: $(imageRepository)
                    tags: $(tag)
                - task: AzureCLI@2
                  displayName: Update Container App image
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name "$(AZURE_APP_NAME)" \
                        --resource-group "$(AZURE_RESOURCE_GROUP)" \
                        --image "$(ACR_LOGIN_SERVER)/$(imageRepository):$(tag)"
